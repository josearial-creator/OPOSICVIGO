name: Verificar Entrenamiento cifrado
on:
  pull_request:
    paths:
      - 'rumbo-worker/training-api.mjs'
      - 'rumbo-worker/worker.mjs'
      - 'docs/rumbo/entrenamiento-rutinas.js'
      - 'docs/rumbo/index.html'
      - 'tests/training-api.test.mjs'
      - 'tests/training-worker-auth.test.mjs'
      - 'tests/package.json'
      - 'scripts/verify-training-cloudflare-isolated.mjs'
      - 'scripts/validate-training-build.mjs'
      - '.github/workflows/verificar-entrenamiento.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis de cliente y Worker
        run: |
          node --check docs/rumbo/entrenamiento-rutinas.js
          node --check rumbo-worker/training-api.mjs
          node --check rumbo-worker/worker.mjs
          node --check scripts/verify-training-cloudflare-isolated.mjs
      - name: Probar almacenamiento cifrado y aislamiento del diario
        run: node --test tests/training-api.test.mjs tests/training-worker-auth.test.mjs
      - name: Compilar Worker temporal sin desplegar ni usar secretos
        run: |
          npm ci --ignore-scripts --prefix rumbo-worker
          node scripts/validate-training-build.mjs
