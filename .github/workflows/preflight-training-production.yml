name: Preflight publicación protegida Entrenamiento PR36
on:
  pull_request:
    paths:
      - 'scripts/preflight-training-production.mjs'
      - 'scripts/release-training-production.mjs'
      - '.github/workflows/release-training-production.yml'
      - '.github/workflows/preflight-training-production.yml'
      - 'rumbo-worker/worker.mjs'
      - 'rumbo-worker/training-api.mjs'
permissions:
  contents: read
jobs:
  solo-lectura:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/entrenamiento-rutinas-registro-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias para compilación local
        run: npm ci --ignore-scripts
        working-directory: rumbo-worker
      - name: Validar sintaxis del preflight
        run: |
          node --check scripts/preflight-training-production.mjs
          node --check scripts/release-training-production.mjs
      - name: Revisar bindings reales de producción y compilar sin desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/preflight-training-production.mjs
