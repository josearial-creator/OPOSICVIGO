name: Verificar limpieza Worker temporal PR36
on:
  pull_request:
    paths:
      - 'scripts/verify-training-cloudflare-postrun.mjs'
      - '.github/workflows/verificar-training-postrun.yml'
permissions:
  contents: read
jobs:
  limpieza:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/entrenamiento-rutinas-registro-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar restauración sin modificar Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-training-cloudflare-postrun.mjs
