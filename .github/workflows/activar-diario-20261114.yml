name: Activar diario autorizado 2026-11-14
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desplegar-rumbo-worker
  cancel-in-progress: false
jobs:
  activar:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[activar-diario-20261114]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Comprobar todas las funciones antes de activar
        env:
          CHROMIUM_PATH: bundled
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -p 'test_actualizar_*.py'
          python3 -m http.server 8086 --bind 127.0.0.1 --directory docs/rumbo >/tmp/rumbo-http.log 2>&1 &
          rumbo_pid=$!
          trap 'kill "$rumbo_pid"' EXIT
          node --test tests/release-notes.test.mjs
          npm test --prefix tests
      - run: npm ci --ignore-scripts
        working-directory: rumbo-worker
      - name: Conservar bindings, activar y comprobar con una nota sintética
        env:
          CLOUDFLARE_ACCOUNT_ID: '2bc103e4dec32961305599da77b877f6'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUMBO_ACCESS_TOKEN: ${{ secrets.RUMBO_ACCESS_TOKEN }}
        run: node scripts/activate-notes-20261114.mjs
